[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "activeledger"
version = "1.3.1"
description = "Python SDK for Activeledger, with post-quantum identity support"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Activeledger" }]
keywords = ["activeledger", "blockchain", "ledger", "post-quantum", "ml-dsa", "falcon"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security :: Cryptography",
]

# Deliberately empty. The core is stdlib-only so that `pip install
# activeledger` cannot fail on a missing C toolchain - see [pq] below.
dependencies = []

[project.optional-dependencies]
# liboqs-python does NOT bundle liboqs. On first import it builds it from
# source, needing git, CMake, a C compiler AND OpenSSL headers. Making that
# mandatory would break pip install for anyone without all four - which for a
# client SDK is close to unusable, and which we hit ourselves on a machine
# that already had gcc, cmake and ninja. Post-quantum is therefore opt-in.
pq = ["liboqs-python>=0.16.0"]

# secp256k1. python-ecdsa is pure Python with no build step, unlike coincurve
# (libsecp256k1) which needs a C toolchain - and which rejects the high-S
# signatures the ledger produces freely, so it would fail on roughly half of
# them.
ec = ["ecdsa>=0.19"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/activeledger/SDK-Python"
Ledger = "https://github.com/activeledger/activeledger"

[tool.setuptools.packages.find]
where = ["src"]

# The BIP-39 wordlist is data, not code, so it needs naming explicitly or a
# wheel installs without it and recovery.py raises at first use rather than
# at build time.
[tool.setuptools.package-data]
activeledger = ["bip39-english.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
